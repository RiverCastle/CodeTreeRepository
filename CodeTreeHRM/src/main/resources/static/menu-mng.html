<!DOCTYPE html>
<!--
  menu-mng.html — 메뉴 관리 화면
  ════════════════════════════════════════════════════════════════
  com_menu 테이블에 저장된 시스템 메뉴를 조회·등록·수정·삭제하는 화면.
  work_frame 에 로드되며, index.html 의 3-프레임 레이아웃 안에서 동작한다.

  [화면 구성 — 3-패널 레이아웃]
    ┌─────────────┬────────────────────────────────┐
    │  트리 패널  │  그리드 패널 (형제 목록)         │
    │  (좌측)     ├────────────────────────────────┤
    │             │  폼 패널 (상세 입력/수정)        │
    └─────────────┴────────────────────────────────┘

  [데이터 흐름]
    1. 페이지 로드 → loadMenus() → GET /api/menus/all
    2. allMenus 배열에 전체 메뉴 보관
    3. renderTree() — allMenus 로 좌측 트리 렌더링
    4. renderGrid() — 선택된 노드의 형제 목록을 우측 그리드에 표시
    5. 노드 클릭 → renderForm()  / 추가 버튼 → renderNewForm()
    6. 저장 → saveMenu() → POST/PUT /api/menus → reloadMenus() → renderAll()
    7. 삭제 → delMenu()  → DELETE /api/menus/{menuCd} → reloadMenus()

  [Dirty 상태 관리]
    기존 메뉴를 선택해 폼 필드를 변경하면 isDirty = true 로 설정.
    신규 추가 중에는 pendingNew 객체가 존재.
    트리/그리드에서 다른 항목으로 이동하려 할 때 guardNavigation() 이
    미저장 변경사항을 확인하는 dirtyModal 을 띄운다.

  [공통 함수 의존성]
    common.js : openAlertModal / openConfirmModal / openDirtyModal /
                resolveDirtyModal / escHtml / showToast
    common.css: 모달·토스트 스타일
  ════════════════════════════════════════════════════════════════
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메뉴관리</title>

<!-- 공통 모달/토스트 스타일 -->
<link rel="stylesheet" href="/common.css">

<style>
  /* ══ CSS 변수 ══ */
  :root {
    --primary:    #2C3E50;  /* 헤더·제목 어두운 남색 */
    --accent:     #82A67D;  /* 주 강조색 (버튼·선택 상태) */
    --bg:         #F1F2F6;  /* 페이지 배경 회색 */
    --danger:     #E74C3C;  /* 삭제·오류 빨간색 */
    --border:     #EAECEF;  /* 구분선 연회색 */
    --new-bg:     #FFFBEA;  /* 신규 행 배경 노란빛 */
    --new-border: #F0C040;  /* 신규 행 좌측 보더 노란색 */
  }

  /* 기본 리셋 */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* 전체 화면을 채우되 스크롤 없도록 */
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: var(--bg); }

  /* ── 전체 레이아웃: 좌(트리) + 우(그리드+폼) 수평 배치 ── */
  .layout {
    display: flex;
    width: 100%;
    height: 100%;
    padding: 20px;
    gap: 18px;
  }

  /* ════════════════════
     좌측 트리 패널
     ════════════════════ */
  .tree-panel {
    width: 360px;
    min-width: 360px;          /* 축소 방지 */
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
    display: flex;
    flex-direction: column;
    overflow: hidden;          /* 내부 스크롤 처리 */
  }

  /* 패널 헤더 (제목 + 버튼 그룹) */
  .panel-header {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 8px;
  }
  .panel-title {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--primary);
    white-space: nowrap;
  }

  /* 소형 버튼 그룹 */
  .btn-group-sm { display: flex; gap: 4px; flex-shrink: 0; }
  .btn-sm {
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid;
    line-height: 1.5;
    white-space: nowrap;
    transition: opacity .15s;
  }
  .btn-sm:hover    { opacity: .75; }
  .btn-sm:disabled { opacity: .35; cursor: not-allowed; }

  /* 버튼 색상 변형 */
  .btn-add-same { background: white;         border-color: var(--accent); color: var(--accent); } /* 동일 추가: 녹색 아웃라인 */
  .btn-add-sub  { background: white;         border-color: #5B8FD4;       color: #5B8FD4; }        /* 하위 추가: 파란 아웃라인 */
  .btn-del      { background: white;         border-color: var(--danger);  color: var(--danger); } /* 삭제: 빨간 아웃라인 */
  .btn-save     { background: var(--accent); border-color: var(--accent);  color: white; }          /* 저장: 녹색 채움 */

  /* 트리 전체 펼치기/접기 툴바 */
  .tree-toolbar {
    padding: 5px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .btn-tree-ctrl {
    font-size: 0.72rem;
    color: #888;
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 0;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color .15s;
  }
  .btn-tree-ctrl:hover { color: var(--accent); }

  /* 트리 노드 목록 영역: overflow-y: auto 로 긴 목록 스크롤 */
  .tree-body { padding: 8px 6px; flex: 1; overflow-y: auto; }

  /* 트리 노드 아이템 */
  .tree-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 0.85rem;
    color: #34495E;
    cursor: pointer;
    user-select: none;      /* 텍스트 드래그 선택 방지 */
    transition: background .1s;
  }
  .tree-item:hover   { background: var(--bg); }
  .tree-item.selected { background: rgba(130, 166, 125, 0.15); color: var(--primary); font-weight: 600; }

  /* 트리 노드 구성 요소 */
  .arrow { font-size: 0.6rem; color: #aaa; width: 12px; flex-shrink: 0; text-align: center; } /* ▶/▼ 화살표 */
  .dot   { font-size: 0.4rem; color: #ccc; width: 12px; text-align: center; flex-shrink: 0; } /* 자식없는 노드 점 */
  .tree-icon  { font-size: 1rem; flex-shrink: 0; }
  .tree-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ════════════════════
     우측 영역 (그리드 + 폼 수직 배치)
     ════════════════════ */
  .right-area {
    flex: 1;
    min-width: 0;           /* flex 자식이 부모를 넘치지 않도록 */
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ── 그리드 패널 ──
     flex: 4 로 폼(flex:5)보다 작은 비율 할당 */
  .grid-panel {
    flex: 4;
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .grid-header {
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--primary);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* 브레드크럼: '— 최상위' 또는 '— M001 하위' 표시 */
  .grid-breadcrumb { font-size: 0.78rem; font-weight: 400; color: #999; }
  .grid-body { flex: 1; overflow-y: auto; }

  /* 테이블 공통 */
  table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  thead th {
    padding: 9px 14px;
    text-align: left;
    background: #F8F9FA;
    color: #555;
    font-weight: 600;
    font-size: 0.79rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    position: sticky;   /* 헤더 고정: 스크롤 시에도 보임 */
    top: 0;
    z-index: 1;
  }
  tbody td { padding: 9px 14px; border-bottom: 1px solid #F3F4F6; color: #34495E; }
  tbody tr { cursor: pointer; }
  tbody tr:hover       { background: #FAFBFC; }
  tbody tr.selected-row { background: rgba(130, 166, 125, 0.1); }
  tbody tr.selected-row td { color: var(--primary); font-weight: 500; }

  /* 신규 추가 행: 노란 배경 + 왼쪽 노란 보더로 시각적 구분 */
  tbody tr.new-row            { background: var(--new-bg); border-left: 3px solid var(--new-border); }
  tbody tr.new-row td         { color: #7A5C00; font-style: italic; }
  tbody tr.new-row.selected-row { background: #FFF3C0; }

  /* 사용여부 배지 */
  .badge     { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.73rem; font-weight: 600; }
  .badge-y   { background: rgba(130, 166, 125, 0.15); color: var(--accent); } /* Y: 녹색 */
  .badge-n   { background: rgba(231, 76, 60, 0.1);    color: var(--danger); } /* N: 빨간 */
  .badge-new { background: rgba(240, 192, 64, 0.2);   color: #9A6B00; }       /* NEW: 노란 */

  .icon-cell { text-align: center; font-size: 1.05rem; }
  .no-data   { color: #ccc; font-size: 0.8rem; }
  .empty-row td { text-align: center; color: #bbb; padding: 20px; font-size: 0.83rem; }

  /* ── 폼 패널 ──
     flex: 5 로 그리드보다 큰 비율 할당 */
  .form-panel {
    flex: 5;
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
    display: flex;
    flex-direction: column;
  }
  .form-header {
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--primary);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* 신규 배지: 미저장 신규 항목 표시 (노란 pill) */
  .form-header-badge {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(240, 192, 64, 0.2);
    color: #9A6B00;
  }

  /* 변경됨 배지: isDirty=true 시 표시 (빨간 pill) */
  .form-header-dirty {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(231, 76, 60, 0.1);
    color: var(--danger);
    display: none;  /* 기본 숨김, markDirty() 에서 표시 */
  }

  /* 폼 헤더 우측 버튼 영역 */
  .form-header-actions { margin-left: auto; display: flex; gap: 6px; }

  /* 폼 바디: 2열 그리드 레이아웃 */
  .form-body {
    padding: 18px 30px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px 36px;
    overflow-y: auto;
    align-content: start;
    flex: 1;
  }

  /* 폼 행 */
  .form-row      { display: flex; align-items: center; gap: 10px; }
  .form-row.full { grid-column: 1 / -1; }  /* full: 2열 전체 차지 */

  /* 폼 레이블 */
  .form-label { width: 72px; font-size: 0.81rem; font-weight: 600; color: #555; flex-shrink: 0; }
  .req { color: var(--danger); } /* 필수 항목 * 표시 */

  /* 폼 입력 필드 공통 */
  .form-input {
    flex: 1;
    padding: 7px 11px;
    border: 1px solid #DDE1E7;
    border-radius: 8px;
    font-size: 0.83rem;
    color: #34495E;
    background: white;
    min-width: 0;
    outline: none;
    transition: border-color .15s;
  }
  .form-input:focus    { border-color: var(--accent); }
  .form-input.readonly { background: #F8F9FA; color: #555; cursor: default; } /* 읽기 전용 */
  .form-input.sm       { flex: none; width: 84px; }  /* 정렬순서처럼 짧은 입력 */
  select.form-input    { cursor: pointer; }

  /* 폼 비어있을 때 안내 메시지 */
  .form-empty {
    color: #bbb;
    font-size: 0.83rem;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    grid-column: 1 / -1;
  }

  /* ── 아이콘 콤보박스 ──
     드롭다운 방식으로 이모지 아이콘을 선택하는 커스텀 컨트롤 */
  .icon-combo { flex: 1; min-width: 0; }

  /* 콤보박스 트리거 버튼 */
  .icon-combo-trigger {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 11px;
    border: 1px solid #DDE1E7;
    border-radius: 8px;
    cursor: pointer;
    background: white;
    user-select: none;
    transition: border-color .15s;
  }
  .icon-combo-trigger:hover { border-color: var(--accent); }
  .ico-preview { font-size: 1.1rem; width: 22px; text-align: center; flex-shrink: 0; }
  .ico-label   { flex: 1; font-size: 0.83rem; color: #34495E; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ico-caret   { font-size: 0.58rem; color: #aaa; flex-shrink: 0; }

  /* 아이콘 드롭다운 패널 (position: fixed 로 부모 overflow 영향 없음) */
  .icon-dropdown {
    position: fixed;           /* 스크롤 영향 없이 뷰포트 기준 */
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    z-index: 9999;
    overflow: hidden;
    width: 280px;
    display: none;             /* 기본 숨김, toggleDrop() 으로 표시 */
  }
  .icon-search { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .icon-search input {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid #DDE1E7;
    border-radius: 7px;
    font-size: 0.81rem;
    outline: none;
  }
  /* 5열 그리드로 아이콘 배치 */
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding: 8px;
    gap: 3px;
    max-height: 180px;
    overflow-y: auto;
  }
  .icon-opt {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 7px 3px;
    border-radius: 7px;
    cursor: pointer;
    gap: 3px;
  }
  .icon-opt:hover  { background: var(--bg); }
  .icon-opt.active { background: rgba(130, 166, 125, 0.15); } /* 선택된 아이콘 강조 */
  .icon-opt .ico   { font-size: 1.3rem; }
  .icon-opt .nm    { font-size: 0.65rem; color: #888; text-align: center; }

  /* ── 라디오 버튼 그룹 (사용여부) ── */
  .radio-group { display: flex; gap: 18px; }
  .radio-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.83rem;
    color: #34495E;
    cursor: pointer;
  }
  .radio-label input[type="radio"] {
    accent-color: var(--accent);  /* 라디오 버튼 색상 커스터마이징 */
    width: 14px;
    height: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- 전체 레이아웃 컨테이너 -->
<div class="layout">

  <!-- ══════════════════════════════
       좌측: 메뉴 트리 패널
       ══════════════════════════════
       com_menu 의 트리 구조를 계층별로 렌더링.
       UPPER_MENU_CD=null: 최상위 노드
       UPPER_MENU_CD 있음: 하위 노드 (들여쓰기)
       선택된 노드에 .selected 클래스 적용 -->
  <div class="tree-panel">

    <!-- 트리 패널 헤더: 제목 + CRUD 버튼 -->
    <div class="panel-header">
      <span class="panel-title">메뉴 목록</span>
      <div class="btn-group-sm">
        <!-- 동일 추가: 현재 선택된 노드와 같은 레벨에 형제 노드 추가 -->
        <button class="btn-sm btn-add-same" onclick="addMenuSameLevel()" title="같은 레벨에 추가">동일 추가</button>
        <!-- 하위 추가: 현재 선택된 노드의 자식 노드 추가 -->
        <button class="btn-sm btn-add-sub"  onclick="addMenuSubLevel()"  title="하위 레벨에 추가">하위 추가</button>
        <!-- 삭제: 선택된 노드 삭제 (자식 있으면 불가) -->
        <button class="btn-sm btn-del"      onclick="delMenu()">삭제</button>
      </div>
    </div>

    <!-- 전체 펼치기/접기 툴바 -->
    <div class="tree-toolbar">
      <button class="btn-tree-ctrl" onclick="expandAll()">▼ 전체 펼치기</button>
      <button class="btn-tree-ctrl" onclick="collapseAll()">▶ 전체 접기</button>
    </div>

    <!-- 트리 노드 목록 (renderTree() 가 이 안에 동적으로 생성) -->
    <div class="tree-body" id="treeBody">
      <div style="text-align:center;color:#ccc;padding:20px;font-size:.82rem;">로딩 중...</div>
    </div>

  </div>
  <!-- /트리 패널 -->

  <!-- ══════════════════════════════
       우측: 그리드 + 폼 영역
       ══════════════════════════════ -->
  <div class="right-area">

    <!-- ── 그리드 패널 ──
         선택된 노드와 같은 레벨(형제)의 메뉴 목록 표시.
         행 클릭 시 selectFromGrid() 호출 → 폼 업데이트 -->
    <div class="grid-panel">
      <div class="grid-header">
        <span>메뉴 목록</span>
        <!-- 브레드크럼: '— 최상위' 또는 '— 사원관리 하위' 등 표시 -->
        <span class="grid-breadcrumb" id="gridBreadcrumb"></span>
      </div>
      <div class="grid-body">
        <table>
          <thead>
            <tr>
              <th style="width:48px">아이콘</th>
              <th style="width:90px">메뉴코드</th>
              <th>메뉴명</th>
              <th style="width:72px">정렬순서</th>
              <th>메뉴 URL</th>
              <th style="width:68px">사용여부</th>
            </tr>
          </thead>
          <!-- renderGrid() 가 이 tbody 를 동적으로 갱신 -->
          <tbody id="gridBody">
            <tr class="empty-row"><td colspan="6">데이터를 불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- /그리드 패널 -->

    <!-- ── 폼 패널 ──
         선택된 메뉴의 상세 정보 입력/수정.
         renderForm() / renderNewForm() 이 formBody 를 동적으로 채운다. -->
    <div class="form-panel">
      <div class="form-header" id="formHeader">
        <span id="formTitle">메뉴 상세</span>
        <!-- 신규 배지: 미저장 신규 항목일 때 표시 (기본 숨김) -->
        <span class="form-header-badge"  id="formNewBadge"   style="display:none">NEW — 미저장</span>
        <!-- 변경됨 배지: 기존 항목 수정 중일 때 표시 (markDirty 에서 활성화) -->
        <span class="form-header-dirty"  id="formDirtyBadge">● 변경됨</span>
        <!-- 저장 버튼 -->
        <div class="form-header-actions">
          <button class="btn-sm btn-save" id="formSaveBtn" onclick="saveMenu()">저장</button>
        </div>
      </div>
      <!-- renderForm() / renderNewForm() / clearForm() 이 이 div 를 교체 -->
      <div class="form-body" id="formBody">
        <div class="form-empty">트리에서 메뉴를 선택하거나 추가 버튼을 눌러주세요.</div>
      </div>
    </div>
    <!-- /폼 패널 -->

  </div>
  <!-- /우측 영역 -->

</div>
<!-- /layout -->

<!-- 아이콘 콤보박스 드롭다운 (position: fixed, 폼 패널 밖에 위치) -->
<div class="icon-dropdown" id="iconDrop">
  <!-- 검색 입력: 아이콘명으로 필터링 -->
  <div class="icon-search">
    <input type="text" id="iconSearch" placeholder="아이콘 검색..." oninput="filterIcons()">
  </div>
  <!-- 아이콘 그리드: renderIconGrid() 가 동적으로 생성 -->
  <div class="icon-grid" id="iconGrid"></div>
</div>

<!-- 공통 모달·토스트 함수 및 HTML 주입 -->
<script src="/common.js"></script>

<script>
/* ════════════════════════════════════════════════════════════════
   § 1. 아이콘 목록 상수
   ────────────────────────────────────────────────────────────────
   아이콘 콤보박스에서 선택 가능한 이모지 목록.
   ico: 이모지 문자열 (DB 저장값), nm: 검색용 한글 이름
════════════════════════════════════════════════════════════════ */
const ICONS = [
  {ico:'👤',nm:'사원'}, {ico:'👥',nm:'그룹'}, {ico:'🏢',nm:'부서'},
  {ico:'🏠',nm:'홈'},   {ico:'⚙️',nm:'설정'}, {ico:'📋',nm:'메뉴'},
  {ico:'🗂️',nm:'파일함'},{ico:'📁',nm:'폴더'}, {ico:'🔐',nm:'권한'},
  {ico:'🔑',nm:'키'},   {ico:'📊',nm:'통계'}, {ico:'📈',nm:'현황'},
  {ico:'🗓️',nm:'일정'}, {ico:'📝',nm:'작성'}, {ico:'🔔',nm:'알림'},
  {ico:'💰',nm:'급여'}, {ico:'🧾',nm:'문서'}, {ico:'🖥️',nm:'시스템'},
  {ico:'👔',nm:'인사'}, {ico:'📌',nm:'고정'}, {ico:'🔍',nm:'검색'},
  {ico:'📂',nm:'폴더2'},{ico:'🏷️',nm:'태그'},  {ico:'📣',nm:'공지'},
  {ico:'✅',nm:'완료'}, {ico:'🔧',nm:'도구'}, {ico:'🌐',nm:'웹'},
];

/* ════════════════════════════════════════════════════════════════
   § 2. 상태 변수
   ────────────────────────────────────────────────────────────────
   화면 전체에서 공유하는 상태값.
   React/Vue 같은 프레임워크 없이 직접 관리한다.
════════════════════════════════════════════════════════════════ */

/** 서버에서 로드한 전체 메뉴 배열 (allMenus). renderTree/renderGrid/renderForm 의 공통 데이터 소스 */
let allMenus = [];

/** 현재 선택된 메뉴코드 (트리/그리드 하이라이트 기준) */
let selectedMenuCd = null;

/**
 * 미저장 신규 행 정보.
 * 추가 버튼 클릭 시 { menuCd, upperMenuCd } 로 설정되고,
 * 저장 또는 삭제(취소) 시 null 로 초기화된다.
 * @type {{menuCd: string, upperMenuCd: string|null}|null}
 */
let pendingNew = null;

/** 아이콘 콤보박스에서 현재 선택된 이모지 문자열 */
let currentIconValue = '';

/**
 * 펼쳐진 트리 노드의 menuCd 를 보관하는 Set.
 * renderTree() 는 이 Set 을 참고해 ▼/▶ 화살표와 자식 렌더링을 결정한다.
 * @type {Set<string>}
 */
let expandedNodes = new Set();

/**
 * 폼 변경 감지 플래그.
 * true: 기존 항목을 수정 중 (formDirtyBadge 표시)
 * false: 수정 없음 또는 저장 완료
 */
let isDirty = false;

/* ════════════════════════════════════════════════════════════════
   § 3. 초기화
   ════════════════════════════════════════════════════════════════ */

/** 페이지 로드 완료 시 메뉴 데이터 로드 */
document.addEventListener('DOMContentLoaded', loadMenus);

/**
 * loadMenus — 서버에서 전체 메뉴를 로드하고 화면을 초기 렌더링한다.
 *
 * GET /api/menus/all : USE_YN 무관 전체 메뉴 (관리화면용)
 * 401 → 세션 만료 → 로그인 페이지 이동
 */
async function loadMenus() {
  try {
    const res = await fetch('/api/menus/all');
    if (res.status === 401) { parent.location.href = '/login'; return; }
    allMenus = await res.json();
    renderAll();                // 트리 + 그리드 초기 렌더링
  } catch(e) {
    await openAlertModal({ icon:'🚫', title:'오류', desc:'메뉴 데이터를 불러올 수 없습니다.' });
  }
}

/**
 * renderAll — 트리와 그리드를 동시에 재렌더링하는 헬퍼.
 * 데이터 변경(저장/삭제/로드) 후 항상 이 함수를 호출한다.
 */
function renderAll() {
  renderTree();
  renderGrid();
}

/* ════════════════════════════════════════════════════════════════
   § 4. Dirty 상태 관리
   ────────────────────────────────────────────────────────────────
   폼 필드가 변경될 때 isDirty=true 로 설정하고 헤더 배지를 표시한다.
   저장/이동 완료 후에는 clearDirty() 로 초기화한다.
════════════════════════════════════════════════════════════════ */

/**
 * markDirty — 폼 변경사항 발생 시 호출.
 * isDirty 플래그를 true 로 설정하고 '● 변경됨' 배지를 표시한다.
 * attachDirtyListeners() 에서 input/change 이벤트 핸들러로 등록된다.
 */
function markDirty() {
  isDirty = true;
  document.getElementById('formDirtyBadge').style.display = 'inline-block';
  document.getElementById('formSaveBtn').style.display    = '';  // 저장 버튼 항상 표시
}

/**
 * clearDirty — Dirty 상태 초기화.
 * 저장 완료, 이동 완료, 폼 재렌더링 시 호출된다.
 */
function clearDirty() {
  isDirty = false;
  document.getElementById('formDirtyBadge').style.display = 'none';
}

/* openAlertModal / openConfirmModal / openDirtyModal / resolveDirtyModal → common.js 에서 제공 */

/**
 * guardNavigation — 다른 노드/행으로 이동 전 미저장 변경사항을 확인한다.
 *
 * isDirty 또는 pendingNew 가 있을 때만 dirtyModal 을 띄운다.
 * 없으면 즉시 true 를 반환해 이동을 허용한다.
 *
 * [반환값]
 *   true  → 이동 허용 (변경 없음 / 저장 성공 / 저장 안 함 선택)
 *   false → 이동 취소 (취소 버튼 클릭 / 저장 실패)
 *
 * @returns {Promise<boolean>}
 */
async function guardNavigation() {
  // 변경사항도 신규 항목도 없으면 바로 이동 허용
  if (!isDirty && !pendingNew) return true;

  const action = await openDirtyModal();  // 사용자에게 저장/버리기/취소 선택 요청

  if (action === 'cancel') return false;  // 취소 → 이동하지 않음

  if (action === 'save') {
    // 저장 후 이동: silent=true 로 saveMenu() 호출 (성공/실패 알림 생략)
    const saved = await saveMenu(true);
    if (!saved) return false;             // 저장 실패(유효성 오류 등) → 이동 취소
  }

  // 'discard' 또는 저장 성공 후: 상태 초기화하고 이동 허용
  isDirty    = false;
  pendingNew = null;
  return true;
}

/* ════════════════════════════════════════════════════════════════
   § 5. 트리 렌더링
   ────────────────────────────────────────────────────────────────
   allMenus 배열을 UPPER_MENU_CD 기준으로 트리 구조로 변환하고
   treeBody 안에 div.tree-item 요소를 재귀적으로 생성한다.
════════════════════════════════════════════════════════════════ */

/**
 * renderTree — 트리 전체를 재렌더링한다.
 *
 * expandedNodes Set 과 pendingNew 상태를 반영하여 노드를 그린다.
 * 루트 노드(UPPER_MENU_CD=null)에서 시작해 renderNode() 를 재귀 호출한다.
 */
function renderTree() {
  const childMap = buildChildMap();                     // { 'M001': [자식, ...], ... }
  const roots    = allMenus.filter(m => !m.upperMenuCd); // 최상위 노드 목록
  const body     = document.getElementById('treeBody');
  body.innerHTML = '';

  /**
   * renderNode — 단일 메뉴 노드를 재귀적으로 렌더링
   *
   * @param {object} menu  렌더링할 메뉴 객체
   * @param {number} depth 들여쓰기 깊이 (루트=0, 1단계=1, ...)
   */
  function renderNode(menu, depth) {
    const kids            = childMap[menu.menuCd] || [];
    const isExpanded      = expandedNodes.has(menu.menuCd);
    // 현재 추가 중인 신규 항목이 이 노드의 자식인지
    const hasPendingChild = pendingNew && pendingNew.upperMenuCd === menu.menuCd;
    // 실제 자식이 있거나 신규 자식이 있으면 펼침 가능
    const hasKids         = kids.length > 0 || hasPendingChild;
    const isSelected      = menu.menuCd === selectedMenuCd;

    // tree-item div 생성
    const item = document.createElement('div');
    item.className      = 'tree-item' + (isSelected ? ' selected' : '');
    item.dataset.menuCd = menu.menuCd;
    // depth 에 따라 padding-left 로 들여쓰기
    item.style.paddingLeft = (10 + depth * 22) + 'px';

    // 화살표 또는 점 아이콘
    const arrow = document.createElement('span');
    if (hasKids) {
      arrow.className   = 'arrow';
      arrow.textContent = (isExpanded || hasPendingChild) ? '▼' : '▶';
    } else {
      arrow.className   = 'dot';
      arrow.textContent = '•';       // 자식 없는 leaf 노드
    }

    // 메뉴 아이콘
    const ico = document.createElement('span');
    ico.className   = 'tree-icon';
    ico.textContent = menu.menuIcon || '📁';

    // 메뉴명 레이블 (USE_YN='N' 이면 회색 취소선)
    const lbl = document.createElement('span');
    lbl.className   = 'tree-label';
    lbl.textContent = menu.menuNm;
    if (menu.useYn === 'N') {
      lbl.style.color          = '#bbb';
      lbl.style.textDecoration = 'line-through';
    }

    item.appendChild(arrow);
    item.appendChild(ico);
    item.appendChild(lbl);
    body.appendChild(item);

    // 클릭 이벤트: 동일 노드 vs 다른 노드 구분
    item.addEventListener('click', async () => {
      // ── 같은 노드 재클릭: 펼침/접힘 토글만 ──
      if (menu.menuCd === selectedMenuCd) {
        if (hasKids) {
          expandedNodes.has(menu.menuCd)
            ? expandedNodes.delete(menu.menuCd)
            : expandedNodes.add(menu.menuCd);
          renderTree();
        }
        return;
      }

      // ── 다른 노드 클릭: 펼침 상태 먼저 변경 후 dirty 체크 ──
      if (hasKids) {
        // 이동 전에 펼침 상태를 미리 토글
        expandedNodes.has(menu.menuCd)
          ? expandedNodes.delete(menu.menuCd)
          : expandedNodes.add(menu.menuCd);
      }

      // 미저장 변경사항이 있으면 사용자에게 확인
      const canNav = await guardNavigation();
      if (!canNav) {
        // 이동 취소 → 펼침 상태 원복
        if (hasKids) {
          expandedNodes.has(menu.menuCd)
            ? expandedNodes.delete(menu.menuCd)
            : expandedNodes.add(menu.menuCd);
        }
        return;
      }

      // 이동 허용: 선택 상태 갱신 후 폼 렌더링
      selectedMenuCd = menu.menuCd;
      renderAll();
      const m = allMenus.find(x => x.menuCd === menu.menuCd);
      if (m) renderForm(m); else clearForm();
    });

    // 하위 노드 재귀 렌더링 (펼쳐진 상태일 때만)
    if (hasKids && (isExpanded || hasPendingChild)) {
      kids.forEach(k => renderNode(k, depth + 1));
      // 신규 추가 중인 하위 노드를 가상 아이템으로 표시
      if (hasPendingChild) renderPendingTreeNode(depth + 1, body);
    }
  }

  // 루트 노드부터 렌더링 시작
  roots.forEach(m => renderNode(m, 0));

  // 최상위 신규 추가 중이면 루트 레벨에 가상 아이템 추가
  if (pendingNew && !pendingNew.upperMenuCd) {
    renderPendingTreeNode(0, body);
  }
}

/**
 * renderPendingTreeNode — 신규 입력 중인 항목을 트리에 가상 노드로 표시한다.
 *
 * 실제 DB에 저장되지 않은 상태이므로 노란 배경에 '(신규 입력 중)' 으로 표시.
 * 클릭 이벤트는 없음 (폼에서 직접 입력 중).
 *
 * @param {number}      depth 들여쓰기 깊이
 * @param {HTMLElement} body  treeBody 요소
 */
function renderPendingTreeNode(depth, body) {
  const item = document.createElement('div');
  item.className = 'tree-item selected';
  item.style.paddingLeft = (10 + depth * 22) + 'px';
  item.style.background  = 'rgba(240,192,64,0.15)'; // 신규: 노란빛 배경
  item.style.color       = '#7A5C00';

  const dot = document.createElement('span'); dot.className = 'dot'; dot.textContent = '•';
  const ico = document.createElement('span'); ico.className = 'tree-icon'; ico.textContent = '📁';
  const lbl = document.createElement('span'); lbl.className = 'tree-label';
  lbl.textContent  = '(신규 입력 중)';
  lbl.style.fontStyle = 'italic';

  item.appendChild(dot);
  item.appendChild(ico);
  item.appendChild(lbl);
  body.appendChild(item);
}

/* ════════════════════════════════════════════════════════════════
   § 6. 그리드 렌더링
   ────────────────────────────────────────────────────────────────
   선택된 메뉴와 같은 레벨(형제)의 메뉴 목록을 테이블로 표시한다.
   신규 추가 중인 항목은 new-row 로 구분하여 추가 표시한다.
════════════════════════════════════════════════════════════════ */

/**
 * renderGrid — 그리드 패널 재렌더링.
 *
 * [표시 기준]
 *   - selectedMenuCd 가 pendingNew.menuCd 와 같으면 → 신규 추가 중
 *     → parentCd = pendingNew.upperMenuCd 기준으로 형제 표시
 *   - 그 외 → selectedMenuCd 로 찾은 메뉴의 upperMenuCd 기준으로 형제 표시
 *   - selectedMenuCd 가 null(미선택) → 최상위 목록 표시
 */
function renderGrid() {
  const tbody = document.getElementById('gridBody');
  const crumb = document.getElementById('gridBreadcrumb');

  let parentCd = null;

  // 현재 선택이 신규 항목인지 판단
  const base = pendingNew && selectedMenuCd === pendingNew.menuCd
    ? null
    : allMenus.find(m => m.menuCd === selectedMenuCd);

  if (pendingNew && selectedMenuCd === pendingNew.menuCd) {
    // 신규 추가 중: 신규 항목의 parentCd 로 형제 결정
    parentCd = pendingNew.upperMenuCd || null;
  } else if (!base) {
    // 선택 없음: 최상위 표시
    parentCd = null;
  } else {
    // 기존 항목 선택: 선택 항목의 부모 기준
    parentCd = base.upperMenuCd || null;
  }

  // 브레드크럼 텍스트 설정
  crumb.textContent = parentCd
    ? '— ' + (allMenus.find(m => m.menuCd === parentCd)?.menuNm || parentCd) + ' 하위'
    : '— 최상위';

  // 형제 목록 필터링
  const items = allMenus.filter(m =>
    parentCd ? m.upperMenuCd === parentCd : !m.upperMenuCd
  );

  // 신규 행을 이 그리드에 표시해야 하는지 판단
  const showPending = pendingNew && (
    parentCd
      ? pendingNew.upperMenuCd === parentCd
      : !pendingNew.upperMenuCd
  );

  // 데이터 없음 처리
  if (!items.length && !showPending) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">표시할 메뉴가 없습니다.</td></tr>';
    return;
  }

  // 기존 행 HTML 생성
  const existingRows = items.map(m => {
    const isSelected = m.menuCd === selectedMenuCd;
    return `
      <tr class="${isSelected ? 'selected-row' : ''}" data-menu-cd="${m.menuCd}"
          onclick="selectFromGrid('${m.menuCd}')">
        <td class="icon-cell">${m.menuIcon || ''}</td>
        <td>${m.menuCd}</td>
        <td id="grid-nm-${m.menuCd}">${escHtml(m.menuNm)}</td>
        <td>${m.menuOrdr}</td>
        <td>${m.menuUrl ? escHtml(m.menuUrl) : '<span class="no-data">—</span>'}</td>
        <td><span class="badge ${m.useYn === 'Y' ? 'badge-y' : 'badge-n'}">${m.useYn}</span></td>
      </tr>`;
  }).join('');

  // 신규(미저장) 행 HTML (있으면)
  const pendingRow = showPending ? `
    <tr class="new-row selected-row" data-menu-cd="${pendingNew.menuCd}">
      <td class="icon-cell">—</td>
      <td><span class="badge badge-new">NEW</span> ${pendingNew.menuCd}</td>
      <td id="grid-nm-new"><em>입력 중...</em></td>
      <td>—</td><td>—</td><td>—</td>
    </tr>` : '';

  tbody.innerHTML = existingRows + pendingRow;
}

/* ════════════════════════════════════════════════════════════════
   § 7. 선택 처리
   ════════════════════════════════════════════════════════════════ */

/**
 * selectFromGrid — 그리드 행 클릭 시 해당 메뉴를 선택한다.
 *
 * - 이미 선택된 행이면 무시 (동일 선택)
 * - 신규 행(pendingNew) 클릭이면 무시 (폼에서 직접 입력 중)
 * - guardNavigation() 으로 dirty 체크 후 폼 업데이트
 *
 * @param {string} menuCd 클릭된 행의 메뉴코드
 */
async function selectFromGrid(menuCd) {
  // 이미 선택된 행 또는 신규 미저장 행은 무시
  if (menuCd === selectedMenuCd) return;
  if (menuCd === (pendingNew && pendingNew.menuCd)) return;

  // 미저장 변경사항 확인
  const canNav = await guardNavigation();
  if (!canNav) return;

  selectedMenuCd = menuCd;

  // 트리에서 해당 노드 하이라이트 갱신 (재렌더링 없이 classList 만 변경)
  document.querySelectorAll('#treeBody .tree-item').forEach(el =>
    el.classList.toggle('selected', el.dataset.menuCd === menuCd)
  );

  // 그리드에서 해당 행 하이라이트 갱신
  document.querySelectorAll('#gridBody tr[data-menu-cd]').forEach(tr =>
    tr.classList.toggle('selected-row', tr.dataset.menuCd === menuCd)
  );

  // 폼 업데이트
  const menu = allMenus.find(m => m.menuCd === menuCd);
  if (menu) renderForm(menu);
}

/* ════════════════════════════════════════════════════════════════
   § 8. 폼 렌더링
   ════════════════════════════════════════════════════════════════ */

/**
 * renderForm — 기존 메뉴 선택 시 폼을 읽기+수정 모드로 렌더링한다.
 *
 * 메뉴코드는 readonly, 나머지 필드는 수정 가능.
 * 폼 변경 시 markDirty() 가 호출되도록 attachDirtyListeners() 를 실행한다.
 *
 * @param {object} menu renderForm 에 표시할 메뉴 객체
 */
function renderForm(menu) {
  currentIconValue = menu.menuIcon || '';
  clearDirty();  // 새 메뉴 선택 시 dirty 초기화

  // 헤더: 상세 모드 (NEW 배지 숨김)
  document.getElementById('formTitle').textContent      = '메뉴 상세';
  document.getElementById('formNewBadge').style.display = 'none';

  // buildFormHtml() 로 폼 HTML 생성 후 formBody 에 삽입
  document.getElementById('formBody').innerHTML = buildFormHtml(
    menu.menuCd, menu.menuNm, menu.menuIcon,
    menu.upperMenuCd, menu.menuUrl, menu.menuOrdr, menu.useYn,
    false   // isNew=false: 수정 모드
  );
  renderIconGrid();        // 아이콘 그리드 초기 렌더링
  attachDirtyListeners();  // 폼 필드 변경 이벤트 등록
}

/**
 * renderNewForm — 신규 추가 시 폼을 입력 모드로 렌더링한다.
 *
 * 메뉴코드와 상위메뉴는 자동 채번/고정값 (readonly),
 * 나머지 필드는 사용자 입력.
 * 신규 폼은 항상 pendingNew 상태이므로 isDirty 대신 pendingNew 로 추적.
 *
 * @param {string}      menuCd     자동 채번된 신규 메뉴코드
 * @param {string|null} parentCd   상위 메뉴코드 (없으면 null → 최상위)
 * @param {number}      defaultOrdr 기본 정렬순서 (형제/자식 max + 1)
 */
function renderNewForm(menuCd, parentCd, defaultOrdr) {
  currentIconValue = '';
  clearDirty();

  // 헤더: 신규 모드 (NEW — 미저장 배지 표시)
  document.getElementById('formTitle').textContent      = '메뉴 상세';
  document.getElementById('formNewBadge').style.display = 'inline-block';
  document.getElementById('formSaveBtn').style.display  = '';  // 저장 버튼 표시

  document.getElementById('formBody').innerHTML = buildFormHtml(
    menuCd, '', '', parentCd, '', defaultOrdr || 1, 'Y',
    true  // isNew=true: 신규 입력 모드
  );
  renderIconGrid();

  // 메뉴명 필드에 포커스 (바로 입력 시작할 수 있도록)
  document.getElementById('f_menuNm')?.focus();

  // 메뉴명 입력 시 그리드 신규 행의 텍스트 실시간 동기화
  document.getElementById('f_menuNm')?.addEventListener('input', syncNewRowName);

  // 신규 폼은 pendingNew 로 상태 추적하므로 dirty 리스너 불필요
}

/**
 * clearForm — 폼 패널을 초기(선택 없음) 상태로 리셋한다.
 * 삭제 후 선택 항목이 없거나 취소 후 초기화 시 호출된다.
 */
function clearForm() {
  clearDirty();
  document.getElementById('formTitle').textContent      = '메뉴 상세';
  document.getElementById('formNewBadge').style.display = 'none';
  document.getElementById('formBody').innerHTML =
    '<div class="form-empty">트리에서 메뉴를 선택하거나 추가 버튼을 눌러주세요.</div>';
}

/**
 * attachDirtyListeners — 폼 필드에 변경 감지 이벤트를 등록한다.
 *
 * 기존 메뉴 수정 모드(renderForm)에서만 호출된다.
 * input 이벤트(텍스트 입력)와 change 이벤트(select, radio) 모두 처리.
 * 변경 시 markDirty() 를 호출해 formDirtyBadge 를 표시한다.
 */
function attachDirtyListeners() {
  // 텍스트/숫자 입력 필드
  const ids = ['f_menuNm', 'f_menuUrl', 'f_menuOrdr', 'f_upperMenuCd'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input',  markDirty);
    if (el) el.addEventListener('change', markDirty);
  });
  // 라디오 버튼(사용여부)
  document.querySelectorAll('input[name="useYn"]').forEach(el =>
    el.addEventListener('change', markDirty)
  );
  // 아이콘 변경은 selectIcon() 에서 직접 markDirty() 호출
}

/**
 * syncNewRowName — 신규 폼의 메뉴명 입력 시 그리드 신규 행의 텍스트를 실시간 갱신한다.
 * renderNewForm() 에서 f_menuNm 의 input 이벤트로 등록된다.
 */
function syncNewRowName() {
  const val  = document.getElementById('f_menuNm')?.value || '';
  const cell = document.getElementById('grid-nm-new');
  if (cell) cell.innerHTML = val ? escHtml(val) : '<em>입력 중...</em>';
}

/**
 * buildFormHtml — 폼 바디 HTML 문자열을 생성한다.
 *
 * 수정 모드(isNew=false): 메뉴코드 readonly, 상위메뉴 select
 * 신규 모드(isNew=true):  메뉴코드 수정 가능, 상위메뉴 readonly (자동 설정)
 *
 * @param {string}      menuCd     메뉴코드
 * @param {string}      menuNm     메뉴명
 * @param {string}      menuIcon   아이콘 이모지
 * @param {string|null} upperMenuCd 상위 메뉴코드
 * @param {string|null} menuUrl    메뉴 URL
 * @param {number}      menuOrdr   정렬순서
 * @param {string}      useYn      사용여부 ('Y'|'N')
 * @param {boolean}     isNew      신규 입력 여부
 * @returns {string} 폼 HTML 문자열
 */
function buildFormHtml(menuCd, menuNm, menuIcon, upperMenuCd, menuUrl, menuOrdr, useYn, isNew) {
  const parentOpts = buildParentOptions(upperMenuCd, menuCd); // 상위메뉴 select 옵션 목록

  // 아이콘 콤보박스 레이블 (선택 안 함 / '👤 사원' 등)
  const icoLabel = menuIcon ? findIconNm(menuIcon) : '선택 안 함';

  // 상위메뉴 표시 텍스트 구성
  const parentMenu  = upperMenuCd ? allMenus.find(m => m.menuCd === upperMenuCd) : null;
  const parentLabel = upperMenuCd
    ? (parentMenu ? (parentMenu.menuIcon || '') + ' ' + parentMenu.menuNm : upperMenuCd)
    : '— 없음 (최상위) —';

  // 상위메뉴 필드: 신규=readonly input, 수정=select
  const upperMenuField = isNew
    ? `<input class="form-input readonly" id="f_upperMenuCd_display" value="${escHtml(parentLabel)}" readonly>
       <input type="hidden" id="f_upperMenuCd" value="${escHtml(upperMenuCd || '')}">`
    : `<select class="form-input" id="f_upperMenuCd">${parentOpts}</select>`;

  return `
    <!-- 메뉴코드: 신규=입력가능, 수정=readonly -->
    <div class="form-row">
      <label class="form-label">메뉴코드 <span class="req">*</span></label>
      <input class="form-input ${isNew ? '' : 'readonly'}" id="f_menuCd"
             value="${escHtml(menuCd)}" ${isNew ? 'placeholder="예: M005 또는 M001-04"' : 'readonly'}>
    </div>

    <!-- 메뉴명: 항상 수정 가능 -->
    <div class="form-row">
      <label class="form-label">메뉴명 <span class="req">*</span></label>
      <input class="form-input" id="f_menuNm" value="${escHtml(menuNm)}" placeholder="메뉴명 입력">
    </div>

    <!-- 아이콘: 콤보박스로 선택 (toggleDrop 으로 드롭다운 열기) -->
    <div class="form-row">
      <label class="form-label">아이콘</label>
      <div class="icon-combo" id="iconCombo">
        <div class="icon-combo-trigger" onclick="toggleDrop(event)">
          <span class="ico-preview" id="icoPreview">${menuIcon || '📁'}</span>
          <span class="ico-label"   id="icoLabel">${escHtml(icoLabel)}</span>
          <span class="ico-caret">▼</span>
        </div>
      </div>
    </div>

    <!-- 상위메뉴: 신규=readonly / 수정=select -->
    <div class="form-row">
      <label class="form-label">상위메뉴</label>
      ${upperMenuField}
    </div>

    <!-- 메뉴 URL: full-width 2열 차지 -->
    <div class="form-row full">
      <label class="form-label">메뉴 URL</label>
      <input class="form-input" id="f_menuUrl" value="${escHtml(menuUrl || '')}" placeholder="/example/path">
    </div>

    <!-- 정렬순서: 짧은 숫자 입력 -->
    <div class="form-row">
      <label class="form-label">정렬순서</label>
      <input class="form-input sm" id="f_menuOrdr" type="number" value="${menuOrdr || 1}" min="1">
    </div>

    <!-- 사용여부: Y/N 라디오 -->
    <div class="form-row">
      <label class="form-label">사용여부</label>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="useYn" value="Y" ${useYn === 'Y' ? 'checked' : ''}> 사용</label>
        <label class="radio-label"><input type="radio" name="useYn" value="N" ${useYn !== 'Y' ? 'checked' : ''}> 미사용</label>
      </div>
    </div>
  `;
}

/**
 * buildParentOptions — 상위메뉴 select 의 option 목록을 생성한다.
 *
 * 자기 자신(selfCd)은 목록에서 제외해 순환 참조를 방지한다.
 * 하위 메뉴는 앞에 전각 공백(　)으로 들여쓰기 표현.
 *
 * @param {string|null} selectedCd 현재 선택된 상위 메뉴코드
 * @param {string}      selfCd     자기 자신 메뉴코드 (목록 제외)
 * @returns {string} option 태그 HTML 문자열
 */
function buildParentOptions(selectedCd, selfCd) {
  let opts = `<option value="">— 없음 (최상위) —</option>`;
  allMenus.filter(m => m.menuCd !== selfCd).forEach(m => {
    const sel    = m.menuCd === selectedCd ? 'selected' : '';
    const indent = m.upperMenuCd ? '　' : '';  // 하위 메뉴 들여쓰기
    opts += `<option value="${m.menuCd}" ${sel}>${indent}${m.menuIcon || ''} ${escHtml(m.menuNm)}</option>`;
  });
  return opts;
}

/* ════════════════════════════════════════════════════════════════
   § 9. CRUD 버튼 처리
   ════════════════════════════════════════════════════════════════ */

/**
 * addMenuSameLevel — 현재 선택된 노드와 같은 레벨에 신규 메뉴를 추가한다.
 *
 * [동작 흐름]
 *   1. 이미 pendingNew 가 있으면 알림 후 종료
 *   2. isDirty 이면 guardNavigation() 으로 저장 여부 확인
 *   3. 현재 선택의 부모(parentCd)를 결정
 *   4. getNextMenuCd(parentCd) 로 자동 채번
 *   5. 형제 중 max menuOrdr + 1 을 defaultOrdr 로 계산
 *   6. pendingNew 설정 → renderAll() → renderNewForm()
 */
async function addMenuSameLevel() {
  // 이미 신규 항목 입력 중이면 차단
  if (pendingNew) {
    await openAlertModal({ icon:'⚠️', title:'알림', desc:'이미 신규 항목이 있습니다.<br>먼저 저장하거나 삭제해주세요.' });
    return;
  }

  // 기존 변경사항 확인
  if (isDirty) {
    const canNav = await guardNavigation();
    if (!canNav) return;
  }

  // 현재 선택 항목의 상위 메뉴코드 결정 (없으면 최상위)
  const sel      = selectedMenuCd ? allMenus.find(m => m.menuCd === selectedMenuCd) : null;
  const parentCd = sel ? (sel.upperMenuCd || null) : null;

  // 서버에서 다음 메뉴코드 채번
  const nextCd = await getNextMenuCd(parentCd);
  if (!nextCd) return;  // 채번 실패

  // 형제 목록 중 최대 정렬순서 + 1 을 기본값으로
  const siblings    = allMenus.filter(m => parentCd ? m.upperMenuCd === parentCd : !m.upperMenuCd);
  const defaultOrdr = siblings.length ? Math.max(...siblings.map(m => m.menuOrdr || 0)) + 1 : 1;

  // 신규 상태 설정
  pendingNew     = { menuCd: nextCd, upperMenuCd: parentCd };
  selectedMenuCd = nextCd;
  if (parentCd) expandedNodes.add(parentCd);  // 부모 노드를 펼쳐 신규 자식이 보이도록

  renderAll();
  renderNewForm(nextCd, parentCd || '', defaultOrdr);
}

/**
 * addMenuSubLevel — 현재 선택된 노드의 하위에 신규 메뉴를 추가한다.
 *
 * [동작 흐름]
 *   1. pendingNew 있거나 선택 없으면 알림 후 종료
 *   2. isDirty 이면 guardNavigation()
 *   3. getNextMenuCd(selectedMenuCd) 로 자동 채번
 *   4. 자식 중 max menuOrdr + 1 을 defaultOrdr 로 계산
 *   5. 부모 노드 펼침 → pendingNew 설정 → renderAll() → renderNewForm()
 */
async function addMenuSubLevel() {
  if (pendingNew) {
    await openAlertModal({ icon:'⚠️', title:'알림', desc:'이미 신규 항목이 있습니다.<br>먼저 저장하거나 삭제해주세요.' });
    return;
  }
  if (!selectedMenuCd) {
    await openAlertModal({ icon:'⚠️', title:'알림', desc:'하위에 추가할 상위 메뉴를 먼저 선택해주세요.' });
    return;
  }

  if (isDirty) {
    const canNav = await guardNavigation();
    if (!canNav) return;
  }

  const nextCd   = await getNextMenuCd(selectedMenuCd);
  if (!nextCd) return;

  const parentCd = selectedMenuCd;

  // 자식 목록 중 최대 정렬순서 + 1
  const children    = allMenus.filter(m => m.upperMenuCd === parentCd);
  const defaultOrdr = children.length ? Math.max(...children.map(m => m.menuOrdr || 0)) + 1 : 1;

  // 부모를 펼쳐 신규 자식이 트리에 보이도록
  expandedNodes.add(parentCd);
  pendingNew     = { menuCd: nextCd, upperMenuCd: parentCd };
  selectedMenuCd = nextCd;

  renderAll();
  renderNewForm(nextCd, parentCd, defaultOrdr);
}

/**
 * delMenu — 선택된 메뉴를 삭제한다.
 *
 * [케이스 A: 신규(미저장) 항목 선택 시]
 *   pendingNew 를 취소하고 이전 항목으로 복귀.
 *   서버 API 호출 없음.
 *
 * [케이스 B: 기존 항목 선택 시]
 *   1. 하위 메뉴 존재 여부 확인 → 있으면 삭제 불가 알림
 *   2. 삭제 확인 모달 표시
 *   3. DELETE /api/menus/{menuCd} 호출
 *   4. 삭제 완료 후 부모 항목으로 선택 이동
 */
async function delMenu() {
  if (!selectedMenuCd && !pendingNew) {
    await openAlertModal({ icon:'⚠️', title:'알림', desc:'삭제할 메뉴를 선택해주세요.' });
    return;
  }

  // ── 케이스 A: 신규(미저장) 항목 취소 ──
  if (pendingNew && selectedMenuCd === pendingNew.menuCd) {
    const parentCd = pendingNew.upperMenuCd;
    pendingNew     = null;
    isDirty        = false;

    // 취소 후 이전 선택으로 복귀: 부모 또는 최상위 첫 번째 항목
    const fallback = parentCd
      ? allMenus.find(m => m.menuCd === parentCd)
      : allMenus.filter(m => !m.upperMenuCd)[0];

    selectedMenuCd = fallback ? fallback.menuCd : null;
    renderAll();
    if (fallback) renderForm(fallback); else clearForm();
    await openAlertModal({ icon:'ℹ️', title:'알림', desc:'신규 항목이 취소되었습니다.' });
    return;
  }

  // ── 케이스 B: 기존 항목 삭제 ──
  const menu     = allMenus.find(m => m.menuCd === selectedMenuCd);
  const hasChild = allMenus.some(m => m.upperMenuCd === selectedMenuCd);

  // 하위 메뉴 존재 시 삭제 불가 (자기참조 FK 제약)
  if (hasChild) {
    await openAlertModal({
      icon:    '🚫',
      title:   '삭제 불가',
      desc:    '하위 메뉴가 존재하므로 삭제할 수 없습니다.<br>하위 메뉴를 먼저 삭제해주세요.',
      okClass: 'modal-btn-danger',
    });
    return;
  }

  // 삭제 확인 모달
  const ok = await openConfirmModal({
    icon:    '🗑️',
    title:   '메뉴 삭제',
    desc:    `<b>${escHtml(menu?.menuNm)}</b> 메뉴를 삭제하시겠습니까?`,
    okText:  '삭제',
    okClass: 'modal-btn-cancel',
  });
  if (!ok) return;

  try {
    const res = await fetch('/api/menus/' + selectedMenuCd, { method: 'DELETE' });
    if (!res.ok) {
      await openAlertModal({ icon:'🚫', title:'삭제 실패', desc:'메뉴 삭제 중 오류가 발생했습니다.', okClass:'modal-btn-danger' });
      return;
    }
    await openAlertModal({ icon:'✅', title:'삭제 완료', desc:'메뉴가 삭제되었습니다.' });

    const parentCd = menu?.upperMenuCd;
    selectedMenuCd = null;
    isDirty        = false;

    // 데이터 재로드
    await reloadMenus();

    // 삭제 후 부모 항목으로 선택 이동
    if (parentCd) {
      selectedMenuCd = parentCd;
      const p = allMenus.find(m => m.menuCd === parentCd);
      if (p) renderForm(p);
    } else {
      clearForm();
    }

    renderAll();
    reloadSidebar();  // 사이드바 메뉴도 갱신
  } catch(e) {
    await openAlertModal({ icon:'🚫', title:'오류', desc:'오류가 발생했습니다.' });
  }
}

/**
 * saveMenu — 폼의 입력값으로 메뉴를 저장(등록/수정)한다.
 *
 * [신규(pendingNew)]: POST /api/menus
 * [수정]: PUT /api/menus/{menuCd}
 *
 * @param {boolean} [silent=false]
 *   true: 이동 중 저장 (guardNavigation 에서 호출)
 *         → 저장 완료 알림·renderAll·reloadSidebar 생략
 *   false: 사용자가 직접 저장 버튼 클릭
 *          → 저장 완료 알림·renderAll·reloadSidebar 실행
 *
 * @returns {Promise<boolean>} 저장 성공 여부 (실패 시 false)
 */
async function saveMenu(silent) {
  const menuCd = document.getElementById('f_menuCd')?.value?.trim();
  const menuNm = document.getElementById('f_menuNm')?.value?.trim();

  // 필수 입력 유효성 검사
  if (!menuCd) {
    await openAlertModal({ icon:'⚠️', title:'입력 오류', desc:'메뉴코드를 입력해주세요.' });
    document.getElementById('f_menuCd')?.focus();
    return false;
  }
  if (!menuNm) {
    await openAlertModal({ icon:'⚠️', title:'입력 오류', desc:'메뉴명을 입력해주세요.' });
    return false;
  }

  const isNew   = !!pendingNew;  // pendingNew 가 있으면 신규 등록
  const useYnEl = document.querySelector('input[name="useYn"]:checked');

  // 서버로 전송할 payload 조립
  const payload = {
    menuCd,
    menuNm,
    menuIcon:    currentIconValue || null,
    upperMenuCd: document.getElementById('f_upperMenuCd')?.value || null,
    menuUrl:     document.getElementById('f_menuUrl')?.value?.trim() || null,
    menuOrdr:    parseInt(document.getElementById('f_menuOrdr')?.value) || 1,
    useYn:       useYnEl ? useYnEl.value : 'Y',
  };

  try {
    // 신규: POST, 수정: PUT
    const res = await fetch(
      isNew ? '/api/menus' : '/api/menus/' + menuCd,
      {
        method:  isNew ? 'POST' : 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      }
    );

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      await openAlertModal({
        icon:    '🚫',
        title:   '저장 실패',
        desc:    escHtml(err.message || '저장 중 오류가 발생했습니다.'),
        okClass: 'modal-btn-danger',
      });
      return false;
    }

    // 저장 성공: 상태 초기화
    pendingNew     = null;
    isDirty        = false;
    selectedMenuCd = menuCd;

    // 저장 후 부모 노드를 펼쳐 저장된 항목이 트리에 보이도록
    if (payload.upperMenuCd) expandedNodes.add(payload.upperMenuCd);

    // 최신 데이터 재로드
    await reloadMenus();

    if (!silent) {
      // 일반 저장: 완료 알림 + 폼 갱신 + 사이드바 갱신
      await openAlertModal({ icon:'✅', title:'저장 완료', desc:'메뉴가 저장되었습니다.' });
      const saved = allMenus.find(m => m.menuCd === menuCd);
      if (saved) renderForm(saved);  // 수정 모드로 폼 갱신
      renderAll();
      reloadSidebar();
    }
    return true;
  } catch(e) {
    await openAlertModal({ icon:'🚫', title:'오류', desc:'오류가 발생했습니다.' });
    return false;
  }
}

/* ════════════════════════════════════════════════════════════════
   § 10. 서버 API 유틸
   ════════════════════════════════════════════════════════════════ */

/**
 * getNextMenuCd — 서버에서 다음 메뉴코드를 자동 채번한다.
 *
 * GET /api/menus/next-cd          → 최상위 채번 (M001, M002, ...)
 * GET /api/menus/next-cd?parentCd — 하위 채번 (M001-01, M001-02, ...)
 *
 * @param {string|null} parentCd 상위 메뉴코드 (null 이면 최상위)
 * @returns {Promise<string|null>} 채번된 메뉴코드 또는 실패 시 null
 */
async function getNextMenuCd(parentCd) {
  try {
    const url  = parentCd
      ? `/api/menus/next-cd?parentCd=${encodeURIComponent(parentCd)}`
      : '/api/menus/next-cd';
    const res  = await fetch(url);
    const data = await res.json();
    return data.menuCd;  // { menuCd: 'M005' } 응답에서 추출
  } catch(e) {
    await openAlertModal({ icon:'🚫', title:'오류', desc:'오류가 발생했습니다.' });
    return null;
  }
}

/**
 * reloadMenus — 서버에서 최신 전체 메뉴 목록을 다시 로드한다.
 * 저장/삭제 후 항상 호출해 allMenus 를 최신 상태로 유지한다.
 */
async function reloadMenus() {
  const res = await fetch('/api/menus/all');
  allMenus  = await res.json();
}

/**
 * reloadSidebar — 좌측 사이드바(menu_frame)를 새로고침한다.
 * 메뉴 저장/삭제 후 사이드바 내비게이션에도 변경사항을 반영한다.
 * try-catch 로 프레임 접근 오류를 무시한다.
 */
function reloadSidebar() {
  try {
    parent.frames.menu_frame && parent.frames.menu_frame.location.reload();
  } catch(e) { /* cross-origin 등 접근 불가 시 무시 */ }
}

/* ════════════════════════════════════════════════════════════════
   § 11. 아이콘 콤보박스
   ════════════════════════════════════════════════════════════════ */

/**
 * renderIconGrid — 아이콘 드롭다운 내부 그리드를 렌더링한다.
 *
 * filter 가 있으면 ico(이모지) 또는 nm(한글명)에 filter 가 포함된 항목만 표시.
 * 현재 선택된 아이콘(currentIconValue)에는 .active 클래스를 추가한다.
 *
 * @param {string} [filter] 검색어 (없으면 전체 표시)
 */
function renderIconGrid(filter) {
  const list = filter
    ? ICONS.filter(i => i.nm.includes(filter) || i.ico.includes(filter))
    : ICONS;

  document.getElementById('iconGrid').innerHTML = list.map(i => `
    <div class="icon-opt ${currentIconValue === i.ico ? 'active' : ''}"
         onclick="selectIcon('${i.ico}','${i.nm}')">
      <span class="ico">${i.ico}</span>
      <span class="nm">${i.nm}</span>
    </div>
  `).join('');
}

/**
 * toggleDrop — 아이콘 드롭다운을 열거나 닫는다.
 *
 * position: fixed 기반이므로 트리거 요소의 getBoundingClientRect() 로
 * 드롭다운 위치를 정확히 계산한다.
 * e.stopPropagation() 으로 document click 이벤트와 충돌을 방지한다.
 *
 * @param {MouseEvent} e 클릭 이벤트
 */
function toggleDrop(e) {
  e.stopPropagation();  // document click 이벤트 전파 차단
  const drop    = document.getElementById('iconDrop');
  const trigger = document.querySelector('#iconCombo .icon-combo-trigger');
  if (!trigger) return;

  // 이미 열려있으면 닫기
  if (drop.style.display === 'block') { drop.style.display = 'none'; return; }

  // 트리거 하단에 드롭다운 위치 설정
  const rect = trigger.getBoundingClientRect();
  drop.style.top  = (rect.bottom + 5) + 'px';
  drop.style.left = rect.left + 'px';
  drop.style.display = 'block';

  // 검색창 초기화 후 포커스
  document.getElementById('iconSearch').value = '';
  renderIconGrid();
  document.getElementById('iconSearch').focus();
}

/**
 * filterIcons — 아이콘 검색 입력 시 목록을 실시간 필터링한다.
 * iconSearch 의 oninput 이벤트에서 호출된다.
 */
function filterIcons() {
  renderIconGrid(document.getElementById('iconSearch').value.trim());
}

/**
 * selectIcon — 아이콘 선택 시 호출된다.
 *
 * 선택된 이모지를 currentIconValue 에 저장하고 콤보박스 트리거 UI 를 갱신.
 * 드롭다운을 닫고 아이콘 그리드를 재렌더링해 active 상태를 반영한다.
 * markDirty() 를 호출해 변경 감지 처리.
 *
 * @param {string} ico 선택된 이모지 문자열
 * @param {string} nm  이모지 한글명
 */
function selectIcon(ico, nm) {
  currentIconValue = ico;

  // 콤보박스 트리거 UI 갱신
  const p = document.getElementById('icoPreview'); if (p) p.textContent = ico;
  const l = document.getElementById('icoLabel');   if (l) l.textContent = ico + ' ' + nm;

  document.getElementById('iconDrop').style.display = 'none';  // 드롭다운 닫기
  renderIconGrid();  // active 상태 갱신
  markDirty();       // 아이콘 변경도 dirty 처리
}

/**
 * 드롭다운 외부 클릭 시 닫기.
 * document 레벨에서 click 이벤트를 잡아 드롭다운 및 트리거 영역 외 클릭 시 숨긴다.
 */
document.addEventListener('click', e => {
  const drop    = document.getElementById('iconDrop');
  const trigger = document.querySelector('#iconCombo .icon-combo-trigger');
  if (drop.style.display !== 'block') return;    // 이미 닫혀있으면 무시
  if (trigger && trigger.contains(e.target)) return;  // 트리거 클릭은 toggleDrop 에서 처리
  if (!drop.contains(e.target)) drop.style.display = 'none';  // 드롭다운 외부 클릭 → 닫기
});

/* ════════════════════════════════════════════════════════════════
   § 12. 트리 전체 펼치기 / 전체 접기
   ════════════════════════════════════════════════════════════════ */

/**
 * expandAll — 자식이 있는 모든 노드를 펼친다.
 * buildChildMap() 의 키(parentCd 목록) 전체를 expandedNodes 에 추가한다.
 */
function expandAll() {
  const childMap = buildChildMap();
  Object.keys(childMap).forEach(cd => expandedNodes.add(cd));
  renderTree();
}

/**
 * collapseAll — 모든 노드를 접는다.
 * expandedNodes Set 을 비운다.
 */
function collapseAll() {
  expandedNodes.clear();
  renderTree();
}

/* ════════════════════════════════════════════════════════════════
   § 13. 유틸 함수
   ════════════════════════════════════════════════════════════════ */

/**
 * buildChildMap — allMenus 를 UPPER_MENU_CD 기준으로 그룹화한다.
 *
 * 반환 형태: { 'M001': [자식메뉴, ...], 'M002': [...] }
 * renderTree / expandAll 에서 자식 목록 조회에 사용된다.
 *
 * @returns {Object.<string, Array>} parentCd → 자식 목록 맵
 */
function buildChildMap() {
  const map = {};
  allMenus.forEach(m => {
    if (m.upperMenuCd) {
      if (!map[m.upperMenuCd]) map[m.upperMenuCd] = [];
      map[m.upperMenuCd].push(m);
    }
  });
  return map;
}

/* escHtml / showToast → common.js 에서 전역 제공 */

/**
 * findIconNm — 이모지로 ICONS 배열에서 한글명을 찾아 레이블 문자열을 반환한다.
 *
 * @param {string} ico 이모지 문자열
 * @returns {string} '👤 사원' 형태 또는 ico 그대로 (목록에 없는 경우)
 */
function findIconNm(ico) {
  const f = ICONS.find(i => i.ico === ico);
  return f ? ico + ' ' + f.nm : ico;
}
