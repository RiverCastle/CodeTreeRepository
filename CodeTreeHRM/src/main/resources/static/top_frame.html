<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --primary: #2C3E50;
            --accent:  #82A67D;
            --danger:  #E74C3C;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: white;
            border-bottom: 1px solid #E0E0E0;
        }
        header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        #breadcrumb { font-size: 0.9rem; color: #7F8C8D; }
        #breadcrumb span { color: var(--primary); font-weight: 600; }
        .header-user { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; color: #555; }
        .avatar {
            width: 32px; height: 32px;
            background: var(--accent);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 0.85rem;
        }
        .btn-logout {
            padding: 5px 12px;
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #888;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-logout:hover { border-color: var(--danger); color: var(--danger); }
    </style>
</head>
<body>
    <header>
        <div id="breadcrumb">홈 &nbsp;/&nbsp; <span id="bc-text">대시보드</span></div>
        <div class="header-user">
            <div class="avatar">A</div>
            <span>admin</span>
            <button class="btn-logout" onclick="parent.location.href='/logout'">로그아웃</button>
        </div>
    </header>
    <script>
        function setBreadcrumb(text) {
            document.getElementById('bc-text').textContent = text;
        }
    </script>
</body>
</html>
