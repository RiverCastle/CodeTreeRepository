<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeTree HRM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        #layout { display: flex; height: 100vh; }
        #menu_frame {
            width: 240px;
            height: 100vh;
            border: none;
            flex-shrink: 0;
        }
        #right-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        #top_frame {
            height: 56px;
            width: 100%;
            border: none;
            flex-shrink: 0;
        }
        #work_frame {
            flex: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="layout">
        <iframe id="menu_frame" name="menu_frame" src="menu_frame.html" scrolling="no"></iframe>
        <div id="right-wrapper">
            <iframe id="top_frame" name="top_frame" src="top_frame.html" scrolling="no"></iframe>
            <iframe id="work_frame" name="work_frame" src="home.html"></iframe>
        </div>
    </div>
    <script>
        function navigate(url, bc) {
            document.getElementById('work_frame').src = url;
            try {
                document.getElementById('top_frame').contentWindow.setBreadcrumb(bc);
            } catch(e) {}
        }
    </script>
</body>
</html>
