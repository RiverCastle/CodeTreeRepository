spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0

# MySQL
spring.datasource.url=jdbc:mysql://192.168.55.219:3306/hrm?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=codetree1
spring.datasource.password=codetree1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Session - MySQL DB에 저장 (서버 재시작 후에도 세션 유지)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=7d